<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Cut paper: a post-it with a blue-pen tick, taped onto a ruled notebook page. -->
  <rect width="64" height="64" fill="#f3efe4"/>
  <g stroke="#bcd0ec" stroke-width="1.5">
    <path d="M0 12.5H64M0 24.5H64M0 36.5H64M0 48.5H64M0 60.5H64"/>
  </g>
  <path d="M10 0V64" stroke="#f0a4a4" stroke-width="2"/>
  <g transform="rotate(-6 33 35)">
    <!-- shadow, then the note with its bottom edge curling up -->
    <path d="M15 19H53V54Q34 51.5 15 54Z" fill="#3c321e" fill-opacity=".22" transform="translate(2 3)"/>
    <path d="M15 19H53V52.5Q34 49 15 52.5Z" fill="#ffe46b"/>
    <path d="M15 19H53V23H15Z" fill="#fff" fill-opacity=".3"/>
    <!-- the tick, in blue pen -->
    <path d="M22.5 35.5L30 43L45.5 26" fill="none" stroke="#2f5fb3" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- tape across the top edge -->
    <rect x="25" y="14.5" width="16" height="8" fill="#d6cdaa" fill-opacity=".75" transform="rotate(4 33 18.5)"/>
  </g>
</svg>
